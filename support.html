</p>

<p>

and, if helpful, include your device model and iOS version.
Please do not send passwords, payment information, or other sensitive
personal information.
</p>

<h2>Premium Subscriptions</h2>

<p>
Premium subscriptions are purchased and managed through Apple.
If you need to view, change, or cancel your subscription, you can manage
your subscriptions through your Apple Account settings.
</p>

<p>
If you previously purchased Premium and the app does not recognize your
subscription, open the Premium screen in Vegan or Nah? and select
<strong>Restore Purchases</strong>.
</p>

<h2>Scanning Tips</h2>

<p>
For the best results, take or choose a clear, close-up photo of the
ingredient list. Make sure the text is readable and well lit.
</p>
